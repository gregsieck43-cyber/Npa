name: Feature request
description: Suggest a focused improvement for the local workbench
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What local-first workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and its approval or privacy implications.
    validations:
      required: true
